    <style>
        * { box-sizing: border-box; }

        .box {
            background: rgba(255, 255, 255, 0.92);

            padding: 30px 20px;
            border-radius: 28px;
            text-align: center;
            width: 100%;

            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);

        h2 { font-size: 1.2rem; margin: 0; font-weight: 700; }
        .box p { font-size: 0.9rem; color: #5b21b6; margin-top: 12px; line-height: 1.5; font-weight: 500; }
        .purpose-btn { margin-top: 35px; padding: 10px 24px; border-radius: 30px; background: linear-gradient(135deg, #ede9fe, #ddd6fe); color: #4c1d95; border: 1.5px solid #a78bfa; text-decoration: none; font-size: .9rem; font-weight: 600; box-shadow: 0 8px 20px rgba(76, 29, 149, .12); transition: .3s ease; }
        .purpose-btn:hover { transform: translateY(-3px); background: linear-gradient(135deg, #ddd6fe, #c4b5fd); box-shadow: 0 12px 25px rgba(76, 29, 149, .2); }
        @media(max-width:600px) { body { padding: 15px; } h1 { font-size: 1.4rem; margin: 25px 0; } .box { max-width: 100%; min-height: 190px; } }
        #install-banner { position: fixed; bottom: 0; left: 0; right: 0; background: #4c1d95; color: #fff; padding: 14px 20px; display: none; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,.15); }

        #install-banner .install-yes { background: #facc15; color: #4c1d95; }

<body>

    <a href="about.html" class="purpose-btn">✨ هدف و داستان این ابزار</a>

    <div id="install-banner">
        <span>📲 می‌خوای این سایت رو مثل یک اپ روی گوشیت نصب کنی؟</span>
        <button class="install-yes" onclick="doInstallPrompt()">نصب کن</button>
        <button class="install-no" onclick="dismissInstallBanner()">فعلاً نه</button>
    </div>

    <script src="./shared/common.js"></script>
    <script>
        // پیشنهاد نصب PWA
        let deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
            if(!localStorage.getItem('nb-install-dismissed')){
                document.getElementById('install-banner').style.display = 'flex';
            }
        });
        function doInstallPrompt(){
            document.getElementById('install-banner').style.display = 'none';
            if(deferredInstallPrompt){
                deferredInstallPrompt.prompt();
            }
        }
        function dismissInstallBanner(){
            document.getElementById('install-banner').style.display = 'none';
            localStorage.setItem('nb-install-dismissed', '1');
        }
    </script>

    <script>
        // ثبت سرویس‌ورکر با مسیر نسبی './sw.js' برای هماهنگی با GitHub Pages
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                window.location.reload();
                            }
                        });
                    });
                }).catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>
