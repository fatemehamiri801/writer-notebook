<style>
/* فونت فارسی Vazirmatn (همان فونت بقیه‌ی صفحه‌ها) */
@font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Regular.woff2') format('woff2'), url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Medium.woff2') format('woff2'), url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Bold.woff2') format('woff2'), url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}

*{margin:0;padding:0;box-sizing:border-box}
html{
    /* هویت بصری مشترک سایت: کاغذ دفترچه، جوهر، طلایی؛ رنگ شاخص کتابخانه: نعنایی */
    --hand:'Aref Ruqaa','Vazirmatn',serif;
    --ink:#3a2a3f;--gold:#c99a3e;--pp:#fbf6e9;--cd:#fffdf7;--line:#e3d8bd;
    --tint:#bfe3d0;--acc:#6fbf9b;--accd:#2f7a5a;--ml:rgba(111,191,155,.6);
    --muted:#7a6a7f;
}
html.nb-dark{--ink:#eadfc6;--pp:#241e17;--cd:#2c251d;--line:#4a3e30;--accd:#8fd1b0;--muted:#a99c82;color-scheme:dark}
body{
    min-height:100vh;font-family:'Vazirmatn','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:var(--ink);line-height:1.8;
    background:radial-gradient(rgba(150,100,130,.14) 1.3px,transparent 1.4px),radial-gradient(circle at 20% 15%,#fbdde6,transparent 55%),radial-gradient(circle at 85% 85%,#d6e4f8,transparent 55%),#f3e4ee;
    background-size:22px 22px,auto,auto,auto;overflow-x:hidden;
}
html.nb-dark body{background:repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0 2px,transparent 2px 9px),radial-gradient(ellipse at 50% 30%,#1d1510,#0c0806 78%)}

/* دکمه‌ی شب/روز (مثل بقیه‌ی صفحه‌ها) */
#dark-mode-toggle{position:fixed;top:15px;left:15px;z-index:1000;width:44px;height:44px;border-radius:50%;background:var(--ink);border:1.5px dashed #e3c26d;color:#e3c26d;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .15s}
html.nb-dark #dark-mode-toggle{background:#2b2118;border-color:#a87b3c}
#dark-mode-toggle:hover{transform:scale(1.06)}
@media(max-width:600px){#dark-mode-toggle{width:38px;height:38px;top:10px;left:10px;font-size:17px}}

/* سربرگ */
.lib-head{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px 18px 124px;
    background:repeating-linear-gradient(transparent 0 31px,rgba(90,70,160,.12) 31px 32px),linear-gradient(to left,transparent 46px,var(--ml) 46px 47px,transparent 47px),color-mix(in srgb,var(--tint) 55%,#fbeee2);
    border-bottom:3px solid var(--acc);
}
html.nb-dark .lib-head{background:#241e17;border-bottom-color:#a87b3c}
.lib-head h1{font-family:var(--hand);font-size:2rem;line-height:1.3;color:var(--ink);font-weight:700}
.lib-head nav{display:flex;flex-wrap:wrap;gap:8px}
.lib-head a{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font:700 .85rem Vazirmatn,Tahoma,sans-serif;text-decoration:none;color:var(--ink);border:1.5px solid var(--ink);background:transparent}
.lib-head a.back{background:var(--accd);border-color:var(--accd);color:#fff}
html.nb-dark .lib-head a.back{color:#1c1712}
.lib-head a:hover{transform:translateY(-2px)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
@media(max-width:600px){.lib-head{padding:58px 14px 14px}.lib-head h1{font-size:1.6rem}.lib-sheet{background:repeating-linear-gradient(transparent 0 35px,rgba(90,70,160,.10) 35px 36px),var(--cd)}}

/* بدنه‌ی صفحه: کاغذ خط‌دار */
.lib-main{max-width:940px;margin:22px auto 70px;padding:0 14px}
.lib-sheet{
    position:relative;border-radius:8px;border:1px solid var(--line);padding:22px 18px 24px;
    background:repeating-linear-gradient(transparent 0 35px,rgba(90,70,160,.10) 35px 36px),linear-gradient(to left,transparent 46px,var(--ml) 46px 47px,transparent 47px),var(--cd);
    box-shadow:2px 3px 0 #e9dfc6,0 8px 18px rgba(60,40,10,.12);
}
html.nb-dark .lib-sheet{box-shadow:0 8px 18px rgba(0,0,0,.5)}
.lib-intro{margin:0 0 14px;color:var(--muted);font-size:.92rem}
#lib-stats{margin-bottom:6px}
.lib-pane{padding:6px 0 0!important}
.nbx-seg{padding-right:0!important;padding-left:0!important}
noscript .lib-intro{color:#c0392b}
html{--tint:#ecc6e4;--acc:#cf8fc2;--accd:#8e4a82;--ml:rgba(207,143,194,.6)}
html.nb-dark{--accd:#e3a6d8}

/* ===== پاستلی و رنگارنگ: چسب کاغذی، پونز و کارت‌های رنگی (مثل بقیه‌ی دفترچه) ===== */
.lib-sheet{overflow:visible}
.lib-sheet::before{content:'';position:absolute;top:-13px;right:50%;margin-right:-52px;width:104px;height:28px;background:#f9e3a3 repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 6px,transparent 6px 12px);opacity:.92;transform:rotate(-2deg);clip-path:polygon(0 0,4% 20%,0 40%,4% 60%,0 80%,0 100%,100% 100%,96% 80%,100% 60%,96% 40%,100% 20%,100% 0);pointer-events:none;z-index:2}
.lib-sheet .nbx-book,.lib-sheet .nbx-formbox{--ca:#e58fa8;position:relative;margin:22px 0 14px;padding:16px 14px 12px;border-radius:6px;background:color-mix(in srgb,var(--ca) 20%,var(--cd));border:1px solid color-mix(in srgb,var(--ca) 50%,var(--line));border-top:5px solid var(--ca);border-right:1px solid color-mix(in srgb,var(--ca) 50%,var(--line));box-shadow:3px 5px 0 rgba(150,120,90,.22),0 8px 16px rgba(60,40,10,.12)}
.lib-sheet .nbx-book::before,.lib-sheet .nbx-formbox::before{content:'';position:absolute;top:-14px;right:50%;margin-right:-42px;width:84px;height:24px;background:var(--ca) repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 6px,transparent 6px 12px);opacity:.88;transform:rotate(-2deg);clip-path:polygon(0 0,4% 20%,0 40%,4% 60%,0 80%,0 100%,100% 100%,96% 80%,100% 60%,96% 40%,100% 20%,100% 0);pointer-events:none}
.lib-sheet .nbx-book::after,.lib-sheet .nbx-formbox::after{content:'';position:absolute;top:-10px;right:22px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 33% 28%,rgba(255,255,255,.85) 0 11%,transparent 12%),radial-gradient(circle at 50% 50%,rgba(255,255,255,.25) 0 55%,transparent 56%),var(--ca);box-shadow:inset -4px -5px 0 rgba(0,0,0,.16),3px 6px 5px rgba(0,0,0,.28);pointer-events:none}
.lib-sheet .nbx-book:nth-child(8n+1),.lib-sheet .nbx-formbox:nth-child(8n+1){--ca:#e58fa8}
.lib-sheet .nbx-book:nth-child(8n+2),.lib-sheet .nbx-formbox:nth-child(8n+2){--ca:#6fbf9b}
.lib-sheet .nbx-book:nth-child(8n+3),.lib-sheet .nbx-formbox:nth-child(8n+3){--ca:#e3b93f}
.lib-sheet .nbx-book:nth-child(8n+4),.lib-sheet .nbx-formbox:nth-child(8n+4){--ca:#6fa6da}
.lib-sheet .nbx-book:nth-child(8n+5),.lib-sheet .nbx-formbox:nth-child(8n+5){--ca:#9d85d6}
.lib-sheet .nbx-book:nth-child(8n+6),.lib-sheet .nbx-formbox:nth-child(8n+6){--ca:#ee9a74}
.lib-sheet .nbx-book:nth-child(8n+7),.lib-sheet .nbx-formbox:nth-child(8n+7){--ca:#9bc25c}
.lib-sheet .nbx-book:nth-child(8n+8),.lib-sheet .nbx-formbox:nth-child(8n+8){--ca:#cf8fc2}
.lib-sheet .nbx-formbox{border-style:solid;border-width:1px;border-top-width:5px}
.lib-sheet .nbx-sum div{background:color-mix(in srgb,var(--c,#6fbf9b) 24%,var(--cd));border:1.5px solid color-mix(in srgb,var(--c,#6fbf9b) 60%,var(--line));border-radius:12px}
.lib-sheet .nbx-sum div:nth-child(2){--c:#e58fa8}.lib-sheet .nbx-sum div:nth-child(3){--c:#6fbf9b}.lib-sheet .nbx-sum div:nth-child(4){--c:#e3b93f}.lib-sheet .nbx-sum div:nth-child(5){--c:#6fa6da}.lib-sheet .nbx-sum div:nth-child(6){--c:#9d85d6}
.lib-sheet .nbx-sum .big{background:var(--accd);border-color:var(--accd)}
.lib-sheet .nbx-sum5{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.lib-sheet .nbx-sum5 div{cursor:pointer;user-select:none;transition:transform .15s,box-shadow .15s}
.lib-sheet .nbx-sum5 div:hover{transform:translateY(-2px)}
.lib-sheet .nbx-sum5 div.on{outline:3px solid var(--c);outline-offset:2px;box-shadow:0 4px 0 rgba(0,0,0,.18);transform:translateY(-2px)}
.lib-sheet .nbx-sum5 div:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.lib-sheet .nbx-sum5 div:nth-child(1){--c:#e3b93f}.lib-sheet .nbx-sum5 div:nth-child(2){--c:#6fa6da}.lib-sheet .nbx-sum5 div:nth-child(3){--c:#ee9a74}.lib-sheet .nbx-sum5 div:nth-child(4){--c:#6fbf9b}.lib-sheet .nbx-sum5 div:nth-child(5){--c:#9d85d6}
.lib-sheet .nbx-chip{background:color-mix(in srgb,var(--c,#6fbf9b) 26%,var(--cd));border-color:color-mix(in srgb,var(--c,#6fbf9b) 70%,var(--line))}
.lib-sheet .nbx-chip:nth-child(6n+1){--c:#e58fa8}.lib-sheet .nbx-chip:nth-child(6n+2){--c:#6fbf9b}.lib-sheet .nbx-chip:nth-child(6n+3){--c:#e3b93f}.lib-sheet .nbx-chip:nth-child(6n+4){--c:#6fa6da}.lib-sheet .nbx-chip:nth-child(6n+5){--c:#9d85d6}.lib-sheet .nbx-chip:nth-child(6n+6){--c:#ee9a74}
.lib-sheet .nbx-chip[aria-pressed="true"]{background:var(--c);color:#3a2a3f;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.lib-sheet .nbx-empty{background:color-mix(in srgb,var(--acc) 14%,var(--cd))}
html.nb-dark .lib-sheet .nbx-book,html.nb-dark .lib-sheet .nbx-formbox{background:color-mix(in srgb,var(--ca) 14%,#2c251d);border-color:#4a3e30;border-top-color:var(--ca);box-shadow:2px 3px 0 #1a1510,0 8px 18px rgba(0,0,0,.45)}
html.nb-dark .lib-sheet .nbx-sum div{background:color-mix(in srgb,var(--c,#6fbf9b) 16%,#2c251d);border-color:#4a3e30}
html.nb-dark .lib-sheet .nbx-sum .big{background:#4d3f22;border-color:#a87b3c}
html.nb-dark .lib-sheet .nbx-chip{background:color-mix(in srgb,var(--c,#6fbf9b) 16%,#2c251d)}
html.nb-dark .lib-sheet .nbx-chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 55%,#2c251d);color:#fff}
</style>
</head>
<body>

<button id="dark-mode-toggle" onclick="toggleDarkMode()" title="حالت شب/روز" aria-label="حالت شب/روز">🌙</button>

<header class="lib-head">
    <h1>✍️ آثار من</h1>
    <nav aria-label="بخش‌های سایت">
        <a class="back" href="index.html">🏠 خانه</a>
        <a href="reader.html">📖 دفترچه کتاب‌خوان</a>

        <a href="game.html">🧩 جورچین کتاب‌ها</a>
    </nav>
</header>

<main class="lib-main">
    <div class="lib-sheet">
        <div id="lib-root"></div>
        <noscript><p class="lib-intro">برای نمایش آثار جاوااسکریپت باید فعال باشد.</p></noscript>
    </div>
</main>

<script>
function toggleDarkMode() {
    var isDark = document.documentElement.classList.toggle('nb-dark');
    try { localStorage.setItem('nb-dark-mode', isDark ? '1' : '0'); } catch (e) {}
    var btn = document.getElementById('dark-mode-toggle');
    if (btn) btn.textContent = isDark ? '☀️' : '🌙';
}
document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('dark-mode-toggle');
    if (btn) btn.textContent = document.documentElement.classList.contains('nb-dark') ? '☀️' : '🌙';
});
if ('serviceWorker' in navigator) { addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); }); }
</script>

</body>
